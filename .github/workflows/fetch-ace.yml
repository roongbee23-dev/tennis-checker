# ปิด schedule ไว้ก่อน — เว็บ Ace of Clubs บล็อก IP datacenter (รันเองได้ผ่าน Run workflow)
name: fetch-ace
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_ace.py
      - run: |
          git config user.name ace-bot
          git config user.email actions@github.com
          git add data/ace.json
          git diff --cached --quiet || (git commit -m "update ace data [skip ci]" && git push)
